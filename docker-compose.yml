services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qf
      POSTGRES_PASSWORD: qf
      POSTGRES_DB: qualityforge
    ports: ["5432:5432"]
    volumes:
      - ./app/backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qf -d qualityforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://qf:qf@db:5432/qualityforge
      JWT_SECRET: local-compose-secret
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
